# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" → "Blueprint" and point it at the repository.
services:
  - type: web
    name: tarek-downloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free gives 512 MB RAM and 100 GB/month of egress, but spins down
    # after 15 minutes idle — the next visitor waits ~50s for a cold start.
    # Move to starter if that wait is unacceptable.
    plan: free
    region: frankfurt      # oregon | frankfurt | singapore | ohio | virginia
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: FILE_TTL_MINUTES
        value: "15"
      # ffmpeg needs room to merge separate video and audio streams, so the
      # peak is roughly twice the finished file. 512 MB of RAM is the binding
      # constraint here, not the disk.
      - key: MAX_FILESIZE_MB
        value: "500"
      - key: MAX_DISK_USAGE_MB
        value: "1024"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: CONCURRENT_FRAGMENTS
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
      # Set this in the Render dashboard, not here — it is a secret.
      - key: ACCESS_PASSWORD
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Netscape cookies.txt contents, if you need Instagram or TikTok.
      - key: COOKIES_FILE
        sync: false
