# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" → "Blueprint" and point it at the repository.
services:
  - type: web
    name: tarek-downloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # "free" also works; it sleeps when idle
    region: frankfurt      # oregon | frankfurt | singapore | ohio | virginia
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: FILE_TTL_MINUTES
        value: "45"
      - key: MAX_FILESIZE_MB
        value: "2048"
      - key: MAX_DISK_USAGE_MB
        value: "4096"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      # Set these in the Render dashboard, not here — they are secrets.
      - key: ACCESS_PASSWORD
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Netscape cookies.txt *contents*. There is no filesystem here to upload
      # a file to, so the contents go in the variable and Stash writes them to
      # disk at boot. Required for Instagram, and for TikTok and YouTube from a
      # datacenter address.
      - key: COOKIES_CONTENT
        sync: false
      # The site allowed to call this engine from a browser — your Vercel
      # address, since the interface is served there.
      - key: CORS_ORIGINS
        sync: false
